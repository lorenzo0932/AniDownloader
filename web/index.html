<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AniDownloader</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇</text></svg>" />
  <script>
    // Tema e color-scheme PRIMA del paint: evita il flash chiaro e dice a
    // WebKitGTK (Tauri) di rendere i controlli nativi (select, option,
    // checkbox) col tema giusto. La stessa logica vive in theme.svelte.js.
    (() => {
      try {
        const saved = localStorage.getItem('theme');
        const mode = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      } catch {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
