[package]
name = "anidownloader"
version = "2.2.0-dev.1"
description = "AniDownloader - Anime download manager"
authors = ["lorenzo0932"]
license = "MIT"
edition = "2021"

[build-dependencies]
# Versioni pinnate per riproducibilità (bug white-screen 2.1.0): semver larghi
# lasciavano risolvere versioni diverse in CI rispetto alla locale. Le versioni
# sotto sono quelle risolte e verificate dal Cargo.lock locale.
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-opener = "=2.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
png = "=0.17.16"
