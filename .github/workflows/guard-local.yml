name: Guard local/* branches

on:
  push:
    branches:
      - 'local/**'

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject push of local/* branches
        run: |
          echo "::error::Push rifiutato: i branch 'local/*' (es. local/reference) devono restare SOLO locali — contengono piani e artefatti AI."
          exit 1
