name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
      - 'licenses/**'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        include:
          - os: windows-2022
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Xcode 15 (default macos-14) = libc++ 15: manca std::jthread e
      # std::format è incompleto. L'immagine monta anche Xcode 16.x
      # (libc++ 16+): selezioniamo l'ultimo disponibile.
      - name: Use latest Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Using: $XCODE"

      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq ccache

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq
          cmake ninja-build pkg-config
          libcurl4-openssl-dev aria2 ffmpeg

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Configure C++
        run: cmake -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.cmake_args || '-DCMAKE_BUILD_TYPE=Debug' }}

      - name: Build C++
        run: cmake --build build

      - name: Test C++ (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

  # ─── Frontend: unit test Vitest + build di produzione (unico check con npm ci) ───
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run tests
        run: npm run test
        working-directory: web

      # La build resta qui volutamente: è l'unico punto che verifica la build di
      # produzione con `npm ci` esatto (embed_web.py nel build C++ usa `npm install`).
      - name: Build production
        run: npm run build
        working-directory: web

  # ─── Formattazione: nessun file fuori stile ───
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: sudo apt-get install -y -qq clang-format

      - name: Check formatting
        run: >
          clang-format --dry-run --Werror
          $(git ls-files 'include/**/*.hpp' 'src/**/*.cpp' 'tests/*.cpp' | grep -v embedded_web_data.cpp)

  # ─── Sanitizer (ASan+UBSan): build + test completi su Linux ───
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq
          cmake ninja-build pkg-config
          libcurl4-openssl-dev aria2 ffmpeg

      - name: Configure (sanitizers)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j 2

      - name: Test
        env:
          ANIDOWNLOADER_BIN: ${{ github.workspace }}/build/AniDownloader
        run: >
          ASAN_OPTIONS=detect_leaks=0
          ctest --test-dir build --output-on-failure

  # ─── Coverage (Linux-only: gcov/lcov): report come artifact, nessuna soglia ───
  # Soglia "soft": valutare il report manualmente; una soglia hard senza tooling
  # di precisione sarebbe controproducente (vedi plan/10-testing-scrapers-coverage.md).
  # NB: con GCC 15 (Fedora 43) geninfo produce conteggi errati (mismatched
  # exception tag, bug gcov); qui il runner usa GCC 13 (ubuntu-24.04) dove non
  # si presenta. I test con gcov diretto restano la fonte di verità locale.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq
          cmake ninja-build pkg-config lcov
          libcurl4-openssl-dev aria2 ffmpeg

      - name: Configure (coverage)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0 -fprofile-update=atomic"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build -j 2

      - name: Test
        env:
          ANIDOWNLOADER_BIN: ${{ github.workspace }}/build/AniDownloader
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: >
          lcov --capture --directory build --output-file coverage.info
          --exclude '*/build/*' --exclude '*/tests/*'
          --ignore-errors mismatch
          --rc lcov_branch_coverage=1 &&
          genhtml coverage.info --branch-coverage --ignore-errors empty
          --output-directory coverage-report

      - name: Show coverage summary
        run: lcov --list coverage.info | grep -E "src/scrapers|src/core|src/web" || true

      - name: Upload report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: warn

  # ─── clang-tidy: report-only (artifact) ───
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-tidy + deps
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq
          clang-tidy cmake ninja-build pkg-config
          libcurl4-openssl-dev

      - name: Generate compile commands
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          mkdir -p tidy-report
          set +e
          clang-tidy -p build \
            $(git ls-files 'src/**/*.cpp' | grep -v embedded_web_data.cpp) \
            > tidy-report/clang-tidy.txt 2>&1
          TIDY_EXIT=$?
          echo "clang-tidy exit: $TIDY_EXIT (report-only, non blocca)"
          exit 0

      - name: Upload report
        uses: actions/upload-artifact@v5
        with:
          name: clang-tidy-report
          path: tidy-report/clang-tidy.txt
          if-no-files-found: warn
