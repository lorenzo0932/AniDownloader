name: CI

on:
  push:
    branches: [main, dev, feat/*]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        include:
          - os: windows-2022
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq
          cmake ninja-build pkg-config
          libcurl4-openssl-dev libssl-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\vcpkg\vcpkg.exe" install openssl:x64-windows

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure C++
        run: cmake -B build ${{ matrix.cmake_args || '-DCMAKE_BUILD_TYPE=Debug' }}

      - name: Build C++
        run: cmake --build build

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build
