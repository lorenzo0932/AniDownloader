name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Piattaforme da buildare (su tag v* girano tutte)
        options:
          - all
          - linux
          - windows
          - macos
        default: all

permissions:
  contents: write

jobs:
  linux:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: System deps (C++)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build pkg-config \
            libcurl4-openssl-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build C++ backend
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Copy binary to Tauri binaries
        run: |
          mkdir -p src-tauri/binaries
          cp build/AniDownloader src-tauri/binaries/anidownloaderd-x86_64-unknown-linux-gnu

      - name: Build Tauri (AppImage)
        run: npx @tauri-apps/cli build
        env:
          NO_STRIP: 1
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Rename AppImage for consistent naming
        run: |
          ARCH=$(uname -m)
          mv src-tauri/target/release/bundle/appimage/*.AppImage \
             "AniDownloader-${{ github.ref_name }}-linux-${ARCH}.AppImage"

      - name: Package headless
        run: |
          HEADLESS_DIR="anidownloaderd-${{ github.ref_name }}-linux-x86_64"
          mkdir -p "$HEADLESS_DIR/web"
          cp build/AniDownloader "$HEADLESS_DIR/anidownloaderd"
          cp -r web/dist/* "$HEADLESS_DIR/web/"
          tar czf "anidownloaderd-${{ github.ref_name }}-linux-x86_64.tar.gz" "$HEADLESS_DIR"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AniDownloader-*.AppImage
            anidownloaderd-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            AniDownloader-*.AppImage
            anidownloaderd-*.tar.gz

  windows:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenSSL & libcurl (vcpkg)
        shell: pwsh
        run: |
          & "C:\vcpkg\vcpkg.exe" install curl[openssl]:x64-windows

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build C++ backend
        shell: cmd
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release

      - name: Copy binary to Tauri binaries
        shell: cmd
        run: |
          if not exist src-tauri\binaries mkdir src-tauri\binaries
          copy build\Release\AniDownloader.exe src-tauri\binaries\anidownloaderd-x86_64-pc-windows-msvc.exe

      - name: Build Tauri (NSIS)
        run: npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Package headless
        shell: pwsh
        run: |
          $dir = "anidownloaderd-$env:GITHUB_REF_NAME-win-x86_64"
          New-Item -ItemType Directory -Path $dir/web -Force | Out-Null
          Copy-Item build/Release/AniDownloader.exe "$dir/anidownloaderd.exe"
          Copy-Item web/dist/* "$dir/web/" -Recurse
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            anidownloaderd-*-win-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            anidownloaderd-*-win-x86_64.zip

  macos:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'macos'
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build C++ backend
        run: |
          cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Copy binary to Tauri binaries
        run: |
          mkdir -p src-tauri/binaries
          cp build/AniDownloader src-tauri/binaries/anidownloaderd-aarch64-apple-darwin

      - name: Build Tauri (DMG)
        run: npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Package headless
        run: |
          dir="anidownloaderd-${{ github.ref_name }}-mac-aarch64"
          mkdir -p "$dir/web"
          cp build/AniDownloader "$dir/anidownloaderd"
          cp -r web/dist/* "$dir/web/"
          tar czf "$dir.tar.gz" "$dir"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            anidownloaderd-*-mac-aarch64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            anidownloaderd-*-mac-aarch64.tar.gz
